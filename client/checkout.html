<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Sugandhmaya</title>
    <link rel="icon" type="image/png" href="./images/Sugandhmaya-icon.webp">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;700&family=DM+Sans:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="checkout-page">

    <header id="main-header" class="fixed top-0 w-full z-50"></header>
    <div id="cart-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden opacity-0"></div>

    <main>
        <div class="checkout-layout-grid">
            <div class="checkout-form-section">
                <div class="form-container">
                    <a href="index.html" class="inline-block mb-10">
                        <span class="text-3xl font-bold font-ui tracking-widest text-brand-text">SUGANDHMAYA</span>
                    </a>
                    <h1 class="text-2xl font-serif mb-6">Shipping Information</h1>
                    <form id="checkout-form">
                        <div class="form-group">
                            <label for="name">Full Name</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone" required maxlength="10">
                        </div>
                        <div class="form-group">
                            <label for="address">Full Address</label>
                            <textarea id="address" name="address" rows="4" required></textarea>
                        </div>

                        <div id="otp-section" class="form-group hidden">
                            <label for="otp">Verification Code</label>
                            <input type="text" id="otp" name="otp" required placeholder="Enter 6-digit code" maxlength="6">
                            <p class="text-sm text-gray-500 mt-2">We've sent a verification code to your email.</p>
                        </div>

                        <div class="form-group">
                             <p class="subheading text-brand-accent">Payment</p>
                             <div class="payment-method">
                                 <span>Cash on Delivery (COD)</span>
                                 <span>Pay upon arrival</span>
                             </div>
                        </div>
                        <button type="submit" id="checkout-submit-button" class="btn w-full mt-6">
                            <span>Send Verification Code</span>
                        </button>
                    </form>
                </div>
            </div>

            <div class="checkout-summary-section">
                <div class="summary-container">
                    <h2 class="text-xl font-serif mb-6">Order Summary</h2>
                    <div id="summary-items" class="space-y-4">
                        </div>
                    <div class="summary-divider"></div>
                    <div class="flex justify-between items-center font-bold">
                        <span>Total</span>
                        <span id="summary-total" class="text-lg"></span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="toast-container" class="fixed bottom-0 left-0 w-full p-8 pointer-events-none z-[200]"></div>
    
    <script>
        async function fetchAndInject(sourceURL, targetSelector) {
            try {
                const response = await fetch(sourceURL);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const text = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'text/html');
                const sourceElement = doc.querySelector(targetSelector);
                const targetElement = document.querySelector(targetSelector);
                if (sourceElement && targetElement) {
                    targetElement.innerHTML = sourceElement.innerHTML;
                }
            } catch (error) {
                console.error(`Failed to fetch and inject ${targetSelector}:`, error);
            }
        }
        
        async function setupPage() {
            // Wait for header and cart to be injected before loading the main script
            await Promise.all([
                fetchAndInject('index.html', '#main-header'),
                fetchAndInject('index.html', '#cart-modal')
            ]);
            
            // Now that the DOM has the header, create and append the main script tag
            const mainScript = document.createElement('script');
            mainScript.src = 'script.js';
            document.body.appendChild(mainScript);
        }
        
        // Run the setup
        setupPage();
    </script>
</body>
</html>
