<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - Sugandhmaya</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="./images/Sugandhmaya-icon.webp" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;700&family=DM+Sans:wght@400;500;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>
</head>

<body class="checkout-page">
    <div id="header-container"></div>

    <div class="checkout-layout-grid">
        <section class="checkout-form-section">
            <div class="form-container">
                <a href="index.html" class="flex items-center mb-8">
                    <img src="./images/Sugandhmaya-icon.webp" alt="Sugandhmaya" class="w-10 h-10 mr-3" />
                    <h1 class="text-3xl font-serif font-bold">Shipping Information</h1>
                </a>

                <form id="checkout-form" class="mt-6 space-y-5" novalidate>
                    <div class="form-group">
                        <label for="full-name">Full name</label>
                        <input id="full-name" name="name" class="form-input" required />
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" class="form-input" required />
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input id="phone" name="phone" type="tel" class="form-input" required />
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="form-group">
                            <label for="country">Country</label>
                            <input id="country" name="country" type="text" class="form-input" required />
                        </div>
                        <div class="form-group">
                            <label for="state">State</label>
                            <input id="state" name="state" type="text" class="form-input" required />
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="address">Address</label>
                        <input id="address" name="address" class="form-input"
                            placeholder="Street address, apartment, etc." required />
                    </div>
                    <div class="form-group">
                        <label for="pin">PIN / ZIP Code</label>
                        <input id="pin" name="pin" class="form-input" required />
                    </div>
                    <div class="form-group pt-4">
                        <button type="submit" id="place-order-button" class="btn w-full">Place Order</button>
                    </div>
                </form>
            </div>
        </section>

        <section class="checkout-summary-section">
            <div class="summary-container">
                <h2 class="font-serif text-2xl mb-6">Order Summary</h2>
                <div id="summary-items" class="space-y-4 mb-4"></div>
                <div class="summary-divider"></div>
                <div class="flex justify-between mt-4 text-lg font-bold">
                    <span>Total</span>
                    <span id="summary-total">₹0.00</span>
                </div>
            </div>
        </section>
    </div>

    <div id="otp-modal"
        class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[200] hidden items-center justify-center p-4">
        <div class="bg-white p-8 rounded-lg shadow-xl max-w-sm w-full text-center">
            <h3 class="text-2xl font-serif font-bold mb-4">Verify Your Order</h3>
            <p class="text-brand-text/80 mb-6">A 6-digit verification code has been sent to your email.</p>
            <div class="form-group">
                <input id="otp-input" maxlength="6" class="form-input text-center tracking-[0.5em] text-2xl"
                    placeholder="------" />
            </div>
            <div class="mt-8 flex gap-4 justify-center">
                <button id="verify-otp-button" class="btn">Verify & Complete Order</button>
                <button id="cancel-otp-button" class="btn btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>
    <div id="toast-container" class="fixed bottom-0 left-0 w-full p-8 pointer-events-none z-[200]"></div>

    <script src="https://cdn.jsdelivr.net/npm/country-state-city@3.2.1/dist/country-state-city.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
