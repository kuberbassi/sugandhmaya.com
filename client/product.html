<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product - Sugandhmaya</title>
    <link rel="icon" type="image/png" href="./images/Sugandhmaya-icon.webp">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;700&family=DM+Sans:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="product-page">

    <header id="main-header" class="fixed top-0 w-full z-50">
    </header>

    <div id="cart-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden opacity-0">
    </div>

    <main>
        <div class="product-page-main">
            <div class="container mx-auto px-6">
                <div class="grid lg:grid-cols-2 gap-12 lg:gap-24">

                    <div class="product-gallery">
                        <div class="main-image-wrapper">
                            <img src="" alt="Main product image" id="main-product-image">
                        </div>
                        <div class="thumbnail-scroller">
                            <button id="scroll-left" class="arrow-btn">&lt;</button>
                            <div class="thumbnail-track-container">
                                <div id="thumbnail-grid" class="thumbnail-track">
                                </div>
                            </div>
                            <button id="scroll-right" class="arrow-btn">&gt;</button>
                        </div>
                    </div>

                    <div class="product-info">
                        <p id="product-category" class="subheading text-brand-accent"></p>
                        <h1 id="product-name" class="text-4xl md:text-5xl font-serif mt-2"></h1>
                        <p id="product-price" class="text-3xl font-sans font-bold mt-4"></p>
                        <p id="product-description" class="mt-6 text-brand-text/70 leading-relaxed"></p>

                        <div class="options-container mt-8 space-y-6">
                            <div id="scent-options"></div>
                            <div id="size-options"></div>
                        </div>

                        <div class="flex items-center gap-6 mt-8">
                            <div class="quantity-selector">
                                <button id="decrease-quantity">-</button>
                                <input id="quantity-input" type="number" value="1" min="1" readonly>
                                <button id="increase-quantity">+</button>
                            </div>
                            <button id="add-to-cart-product" class="btn flex-grow">
                                <span>Add to Cart</span>
                            </button>
                        </div>

                        <div class="product-accordions mt-12">
                            <div class="accordion-item">
                                <button class="accordion-header">
                                    <span>Product Details</span>
                                    <span class="plus-minus"></span>
                                </button>
                                <div class="accordion-content">
                                    <p>Details about materials, dimensions, and origin will go here.</p>
                                </div>
                            </div>
                            <div class="accordion-item">
                                <button class="accordion-header">
                                    <span>How to Use</span>
                                    <span class="plus-minus"></span>
                                </button>
                                <div class="accordion-content">
                                    <p>Instructions on the best way to use and enjoy the product.</p>
                                </div>
                            </div>
                            <div class="accordion-item">
                                <button class="accordion-header">
                                    <span>Shipping & Returns</span>
                                    <span class="plus-minus"></span>
                                </button>
                                <div class="accordion-content">
                                    <p>Our shipping policy and information about returns or exchanges.</p>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="toast-container" class="fixed bottom-0 left-0 w-full p-8 pointer-events-none z-[200]"></div>

    <script>
        // This function fetches content from another page and injects it.
        async function fetchAndInject(sourceURL, targetSelector) {
            try {
                const response = await fetch(sourceURL);
                const text = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'text/html');
                const sourceContent = doc.querySelector(targetSelector).innerHTML;
                document.querySelector(targetSelector).innerHTML = sourceContent;
            } catch (error) {
                console.error(`Failed to fetch and inject ${targetSelector}:`, error);
            }
        }

        // This new function controls the page setup order.
        async function setupPage() {
            // 1. Wait for both the header and the cart modal to finish loading.
            await Promise.all([
                fetchAndInject('index.html', '#main-header'),
                fetchAndInject('index.html', '#cart-modal')
            ]);

            // 2. NOW that the buttons exist in the HTML, create and load the main script file.
            const mainScript = document.createElement('script');
            mainScript.src = 'script.js';
            document.body.appendChild(mainScript);
        }

        // Run the setup.
        setupPage();
    </script>


    <script src="script.js"></script>

</body>

</html>
