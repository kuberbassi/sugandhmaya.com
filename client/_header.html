<header id="main-header" class="fixed top-0 w-full z-50">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
        <a href="index.html" class="flex items-center">
            <div id="nav-icon">
                <img src="./images/Sugandhmaya-icon.webp" alt="Sugandhmaya Logo">
            </div>
            <span style="font-family: var(--font-ui);" class="text-xl font-bold tracking-widest text-brand-text">SUGANDHMAYA</span>
        </a>
        <div class="flex items-center">
            <nav class="hidden md:flex space-x-8 items-center">
                <a href="shop.html" class="nav-link">Shop</a>
                <a href="index.html#collection" class="nav-link">Collection</a>
                <a href="index.html#our-promise" class="nav-link">Our Promise</a>
            </nav>
            <div class="hidden md:block border-l border-black/10 h-6 mx-8"></div>
            <a href="index.html#contact" class="hidden md:inline-block nav-link">Contact</a>
            <button class="ml-8 relative" id="open-cart-button" aria-label="Open cart">
                <svg class="w-6 h-6 text-brand-text" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                </svg>
                <span id="cart-counter"
                    class="absolute -top-2 -right-2 bg-brand-accent text-black text-xs rounded-full h-5 w-5 flex items-center justify-center font-bold">0</span>
            </button>
        </div>
    </div>
</header>

<div id="cart-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden opacity-0">
    <div id="cart-panel"
        class="fixed top-0 right-0 h-full w-full max-w-md bg-white shadow-2xl flex flex-col transform translate-x-full">
        <div class="flex justify-between items-center p-6 border-b">
            <h2 class="text-2xl font-serif">Your Cart</h2><button id="close-cart-button"
                class="text-gray-500 hover:text-black text-3xl">&times;</button>
        </div>
        <div id="cart-items" class="flex-grow p-6 overflow-y-auto">
            <p id="empty-cart-message" class="text-gray-500 text-center">Your cart is empty.</p>
        </div>
        <div class="p-6 border-t bg-gray-50">
            <div class="flex justify-between items-center mb-4"><span class="text-lg">Subtotal</span><span
                    id="cart-subtotal" class="text-lg font-semibold">₹0.00</span></div>
            <a href="checkout.html" id="checkout-button" class="w-full btn">Proceed to Checkout</a>
        </div>
    </div>
</div>
