<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Shop all artisanal puja essentials from Sugandhmaya. Explore our full collection of handcrafted products.">
    <title>Shop All Products - Sugandhmaya</title>
    <link rel="icon" type="image/png" href="./images/Sugandhmaya-icon.webp">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;700&family=DM+Sans:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="shop-page">
    <div id="header-container"></div>

    <main class="shop-page">
        <section class="shop-hero">
            <div class="shop-hero-background"></div>
            <h1 class="shop-title">Shop All Products</h1>
            <p class="shop-description">
                Discover our full collection of handcrafted puja essentials. Each product is a
                work of art, designed to bring peace and serenity to your sacred rituals.
            </p>
        </section>

        <section class="filter-section">
            <div class="filter-buttons">
                <button class="filter-button active">All Products</button>
                <button class="filter-button">Agarbatti</button>
                <button class="filter-button">Premium Box</button>
                <button class="filter-button">Travel Pack</button>
            </div>
        </section>

        <div class="products-grid">
            <!-- Product Card Template -->
            <article class="product-card">
                <div class="product-image">
                    <img src="./images/products/sugandhmaya_chandan_agarbatti/1.webp" alt="Agarbatti">
                </div>
                <div class="product-details">
                    <div class="product-category">Agarbatti</div>
                    <h3 class="product-title">Sugandhmaya Agarbatti</h3>
                    <div class="product-price">₹330</div>
                </div>
            </article>
            <!-- Repeat product cards as needed -->
        </div>
    </main>

    <div id="footer-container"></div>

    <div id="contact-popover" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[150] hidden opacity-0">
        <div id="contact-popover-content"
            class="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full text-center transform scale-95 transition-transform duration-300">
            <h3 id="popover-title" class="text-xl font-serif font-bold mb-3"></h3>
            <div id="popover-body" class="text-brand-text/80"></div>
            <button id="popover-close"
                class="absolute -top-3 -right-3 bg-white rounded-full w-8 h-8 flex items-center justify-center shadow-md">&times;</button>
        </div>
    </div>
    <div id="toast-container" class="fixed bottom-0 left-0 w-full p-8 pointer-events-none z-[200]"></div>
    <script src="script.js"></script>
</body>

</html>
