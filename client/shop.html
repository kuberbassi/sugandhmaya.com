<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Shop all artisanal puja essentials from Sugandhmaya. Explore our full collection of handcrafted products.">
    <title>Shop All Products - Sugandhmaya</title>
    <link rel="icon" type="image/png" href="./images/Sugandhmaya-icon.webp">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;700&family=DM+Sans:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" as="style" crossorigin>
    <link rel="stylesheet" href="style.css">
</head>

<body class="shop-page">
    <div id="header-container"></div>

    <main class="shop-main">
        <div class="container mx-auto px-6">
            <header class="shop-hero text-center pt-32 pb-16">
                <h1 class="text-6xl font-bold font-serif text-brand-text mb-4">Shop All Products</h1>
                <p class="text-lg max-w-2xl mx-auto text-brand-text/70">Discover our full collection of handcrafted puja essentials. Each product is a work of art, designed to bring peace and serenity to your sacred rituals.</p>
            </header>

            <div id="filter-section" class="flex justify-center flex-wrap gap-4 mb-16 px-6">
                <div id="category-filter" class="flex flex-wrap gap-3">
                    </div>
            </div>

            <div id="shop-grid" class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
                </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <div id="contact-popover"
        class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[150] hidden opacity-0">
        <div id="contact-popover-content"
            class="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full text-center transform scale-95 transition-transform duration-300">
            <h3 id="popover-title" class="text-xl font-serif font-bold mb-3"></h3>
            <div id="popover-body" class="text-brand-text/80"></div>
            <button id="popover-close"
                class="absolute -top-3 -right-3 bg-white rounded-full w-8 h-8 flex items-center justify-center shadow-md">&times;</button>
        </div>
    </div>
    <div id="toast-container" class="fixed bottom-0 left-0 w-full p-8 pointer-events-none z-[200]"></div>
    <script src="script.js"></script>
</body>

</html>
