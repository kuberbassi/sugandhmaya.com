<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Sugandhmaya</title>
    <link rel="icon" type="image/png" href="./images/Sugandhmaya.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="shop-page">

    <header id="main-header" class="fixed top-0 w-full z-50 scrolled">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center">
                 <span style="font-family: var(--font-ui);" class="text-xl font-bold tracking-widest text-brand-text">SUGANDHMAYA</span>
            </a>
            <div class="flex items-center">
                <nav class="hidden md:flex space-x-8 items-center">
                    <a href="index.html#collection" class="nav-link">Collection</a>
                    <a href="index.html#our-promise" class="nav-link">Our Promise</a>
                </nav>
                 <div class="hidden md:block border-l border-black/10 h-6 mx-8"></div>
                <a href="index.html#contact" class="hidden md:inline-block nav-link">Contact</a>
                <button class="ml-8 relative" id="open-cart-button">
                    <svg class="w-6 h-6 text-brand-text" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                    <span id="cart-counter" class="absolute -top-2 -right-2 bg-brand-accent text-black text-xs rounded-full h-5 w-5 flex items-center justify-center font-bold">0</span>
                </button>
            </div>
        </div>
    </header>

    <div id="cart-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden opacity-0">
        <div id="cart-panel" class="fixed top-0 right-0 h-full w-full max-w-md bg-white shadow-2xl flex flex-col transform translate-x-full">
            <div class="flex justify-between items-center p-6 border-b"><h2 class="text-2xl font-serif">Your Cart</h2><button id="close-cart-button" class="text-gray-500 hover:text-black text-3xl">&times;</button></div>
            <div id="cart-items" class="flex-grow p-6 overflow-y-auto"><p id="empty-cart-message" class="text-gray-500">Your cart is empty.</p></div>
            <div class="p-6 border-t bg-gray-50"><div class="flex justify-between items-center mb-4"><span class="text-lg">Subtotal</span><span id="cart-subtotal" class="text-lg font-semibold">₹0.00</span></div><button id="checkout-button" class="w-full btn">Proceed to Checkout</button></div>
        </div>
    </div>

    <main class="pt-32 pb-24">
        <div class="container mx-auto px-6">
            <h1 class="text-4xl lg:text-5xl font-serif text-brand-text text-center">Our Full Collection</h1>
            <div class="grid lg:grid-cols-4 gap-12 mt-16">
                <aside class="lg:col-span-1">
                    <h3 class="text-xl font-bold font-sans">Filter Products</h3>
                    <div class="mt-6 space-y-4" id="filters">
                        <div>
                            <label class="font-semibold">Category</label>
                            <div class="mt-2 space-y-2" id="category-filter">
                                </div>
                        </div>
                    </div>
                </aside>

                <div class="lg:col-span-3">
                    <div id="shop-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-x-12 gap-y-16">
                        </div>
                </div>
            </div>
        </div>
    </main>
    
    <script src="script.js"></script>
</body>
</html>
