<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Sugandhmaya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="checkout-page">

    <main class="grid md:grid-cols-2 min-h-screen">
        <div class="p-8 lg:p-12 pt-16 md:pt-24 order-2 md:order-1">
            <a href="index.html" class="flex items-center">
                <span style="font-family: var(--font-ui);" class="text-xl font-bold tracking-widest text-brand-text">SUGANDHMAYA</span>
            </a>
            <h1 class="text-3xl lg:text-4xl font-serif text-brand-text mt-12">Shipping Details</h1>
            <form id="checkout-form" class="mt-8 space-y-6">
                <div>
                    <label for="name" class="checkout-label">Full Name</label>
                    <input type="text" id="name" name="name" class="checkout-input" required>
                </div>
                <div>
                    <label for="email" class="checkout-label">Email Address</label>
                    <input type="email" id="email" name="email" class="checkout-input" required>
                </div>
                <div>
                    <label for="address" class="checkout-label">Full Address</label>
                    <textarea id="address" name="address" rows="3" class="checkout-input" required></textarea>
                </div>
                 <div>
                    <label for="phone" class="checkout-label">Phone Number</label>
                    <input type="tel" id="phone" name="phone" class="checkout-input" required>
                </div>
                <div class="pt-6">
                     <p class="font-semibold">Payment Method</p>
                     <div class="mt-2 p-4 border border-gray-200 rounded-md bg-white">
                         <p class="font-medium">Cash on Delivery (COD)</p>
                         <p class="text-sm text-gray-500 mt-1">Pay with cash upon delivery of your order.</p>
                     </div>
                </div>
                <button type="submit" class="w-full btn">
                    <span>Place Order</span>
                </button>
            </form>
        </div>

        <div class="dark-panel p-8 lg:p-12 pt-16 md:pt-24 order-1 md:order-2">
             <h2 class="text-3xl lg:text-4xl font-serif">Order Summary</h2>
             <div id="summary-items" class="mt-8 space-y-4">
                 </div>
             <div class="mt-8 pt-6 border-t border-white/10">
                 <div class="flex justify-between items-center text-lg">
                     <span>Total</span>
                     <span id="summary-total" class="font-bold"></span>
                 </div>
             </div>
        </div>
    </main>
    
    <script src="script.js"></script>
</body>
</html>
